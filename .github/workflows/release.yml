name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          output="jam_${GOOS}_${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$output" .
          echo "ARTIFACT=$output" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jam_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$previous_tag" ]; then
            changelog=$(git log --pretty=format:"- %s" "${previous_tag}..HEAD")
          else
            changelog=$(git log --pretty=format:"- %s")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ env.CHANGELOG }}
          files: artifacts/*
