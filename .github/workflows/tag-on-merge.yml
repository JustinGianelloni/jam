name: Tag on Merge

on:
  pull_request:
    types: [closed]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            echo "part=major" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            echo "part=minor" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'patch') }}; then
            echo "part=patch" >> "$GITHUB_OUTPUT"
          else
            echo "part=" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest tag and bump version
        if: steps.bump.outputs.part != ''
        id: version
        run: |
          latest=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ steps.bump.outputs.part }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.tag != ''
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
