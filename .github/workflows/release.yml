name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cross: true
            zig_target: aarch64-linux-gnu
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: windows
            goarch: arm64
            runner: windows-latest
            cross: true
            zig_target: aarch64-windows-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig (cross-compilation)
        if: matrix.cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          output="jam_${GOOS}_${GOARCH}${ext}"

          if [ "${{ matrix.cross }}" = "true" ]; then
            export CC="zig cc -target ${{ matrix.zig_target }}"
            export CXX="zig c++ -target ${{ matrix.zig_target }}"
          fi

          go build -ldflags="-s -w -X github.com/justingianelloni/jam/internal/update.Version=${GITHUB_REF_NAME}" -o "$output" .
          echo "ARTIFACT=$output" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jam_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$previous_tag" ]; then
            changelog=$(git log --pretty=format:"- %s" "${previous_tag}..HEAD")
          else
            changelog=$(git log --pretty=format:"- %s")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            ${{ env.CHANGELOG }}
          files: artifacts/*
